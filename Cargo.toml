[package]
name = "bside"
version = "0.1.0"
edition = "2024"
description = "Self-hosted Spotify listening & friend-circle analytics CLI with hidden playlist rebuilding, built on librespot and SQLite"
license = "MIT"
repository = "https://github.com/002love/bside"
keywords = ["spotify", "librespot", "analytics", "cli", "sqlite"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
anyhow = "1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
http = "1"
librespot-core = "0.8"
librespot-oauth = "0.8"
librespot-protocol = "0.8"
protobuf = "3"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
