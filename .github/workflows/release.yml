name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v0.1.0). Defaults to the current ref or Cargo.toml version."
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
            TAG="v${VERSION}"
          fi

          if [[ "${TAG}" != v* ]]; then
            TAG="v${TAG}"
          fi

          echo "Resolved release tag: ${TAG}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build (${{ matrix.asset_suffix }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_suffix: x86_64-linux
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            asset_suffix: aarch64-linux
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            asset_suffix: x86_64-macos
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_suffix: aarch64-macos
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_suffix: x86_64-windows
            archive: zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for Web UI
        id: web_ui
        shell: bash
        run: |
          if [ -f "web/package.json" ]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Setup Node.js
        if: steps.web_ui.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Web UI
        if: steps.web_ui.outputs.exists == 'true'
        shell: bash
        working-directory: web
        run: npm ci && npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive and checksum (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ARCHIVE="bside-${TAG}-${ASSET_SUFFIX}.tar.gz"
          tar -czf "dist/${ARCHIVE}" -C "target/${TARGET}/release" bside
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
            else
              shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
            fi
          )

      - name: Package archive and checksum (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = "bside-$env:TAG-$env:ASSET_SUFFIX.zip"
          $archivePath = Join-Path "dist" $archive
          $binaryPath = Join-Path "target" "$env:TARGET\release\bside.exe"
          Compress-Archive -Path $binaryPath -DestinationPath $archivePath -Force
          $hash = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $line = "$hash  $archive`n"
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path "dist") "$archive.sha256"), $line, [System.Text.UTF8Encoding]::new($false))

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: bside-${{ matrix.asset_suffix }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate combined SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          LC_ALL=C cat *.sha256 | LC_ALL=C sort -k 2 > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: bside ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS.txt
