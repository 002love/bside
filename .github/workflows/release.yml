name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (auto inspects Conventional Commits since last tag)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      tag:
        description: "Explicit release version or tag (e.g. v1.0.0). Overrides bump."
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release & version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      skip: ${{ steps.meta.outputs.skip }}
      tag: ${{ steps.meta.outputs.tag }}
      ref: ${{ steps.meta.outputs.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve version, bump & tag
        id: meta
        shell: bash
        env:
          INPUT_BUMP: ${{ inputs.bump || 'auto' }}
          INPUT_TAG: ${{ inputs.tag || '' }}
        run: |
          set -euo pipefail

          # Case 1: Triggered directly by pushing a v* tag
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            echo "Building existing tag: ${TAG}"
            echo "skip=false" >> "${GITHUB_OUTPUT}"
            echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
            echo "ref=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Case 2: Push to main — skip if already tagged or docs-only since last tag
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            EXISTING_TAGS="$(git tag --points-at HEAD 'v*')"
            if [[ -n "${EXISTING_TAGS}" ]]; then
              echo "HEAD is already tagged (${EXISTING_TAGS}); skipping auto-release."
              echo "skip=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            HEAD_SUBJECT="$(git log -1 --format=%s)"
            if [[ "${HEAD_SUBJECT}" == chore\(release\):* ]]; then
              echo "HEAD is a release bump commit; skipping auto-release."
              echo "skip=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            LAST_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"
            if [[ -n "${LAST_TAG}" ]]; then
              CODE_CHANGES="$(git diff --name-only "${LAST_TAG}..HEAD" -- ':!*.md' ':!LICENSE' || true)"
              if [[ -z "${CODE_CHANGES}" ]]; then
                echo "Only documentation changed since ${LAST_TAG}; skipping auto-release."
                echo "skip=true" >> "${GITHUB_OUTPUT}"
                exit 0
              fi
            fi
          fi

          # Compute and write next version
          ARGS=(scripts/bump-version.mjs --write --bump "${INPUT_BUMP}")
          if [[ -n "${INPUT_TAG}" ]]; then
            ARGS+=(--tag "${INPUT_TAG}")
          fi

          META_OUT="$(node "${ARGS[@]}")"
          echo "${META_OUT}"
          TAG="$(printf '%s\n' "${META_OUT}" | sed -n 's/^tag=//p')"
          VERSION="$(printf '%s\n' "${META_OUT}" | sed -n 's/^version=//p')"

          # If explicit tag already exists on dispatch, rebuild it as-is
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]] && git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "${TAG}")"
            echo "Rebuilding existing tag ${TAG} (${TAG_SHA})"
            echo "skip=false" >> "${GITHUB_OUTPUT}"
            echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
            echo "ref=${TAG_SHA}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          PRE_BUMP_SHA="$(git rev-parse HEAD)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet; then
            git add Cargo.toml Cargo.lock src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json web/package.json
            git commit -m "chore(release): ${TAG} [skip ci]"
          fi

          git tag -a "${TAG}" -m "Release ${TAG}"

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            git push origin HEAD:refs/heads/main
            git push origin "${TAG}"

            # Best-effort fast-forward dev branch so it stays synced with the bumped version
            if git ls-remote --exit-code --heads origin dev >/dev/null 2>&1; then
              git fetch origin dev:refs/remotes/origin/dev
              if git merge-base --is-ancestor origin/dev "${PRE_BUMP_SHA}"; then
                git push origin HEAD:refs/heads/dev || true
              fi
            fi
          else
            git push origin "${TAG}"
          fi

          RELEASE_SHA="$(git rev-parse HEAD)"
          echo "Created release tag ${TAG} at ${RELEASE_SHA}"
          echo "skip=false" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "ref=${RELEASE_SHA}" >> "${GITHUB_OUTPUT}"

  build-web:
    name: Build Web UI
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Web UI
        working-directory: web
        run: npm ci && npm run build

      - name: Upload Web UI dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  build-linux-cli:
    name: Build Linux CLI (${{ matrix.asset_suffix }})
    needs: [prepare, build-web]
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_suffix: x86_64-linux
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            asset_suffix: aarch64-linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Download prebuilt Web UI
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive and checksum
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ARCHIVE="bside-${TAG}-${ASSET_SUFFIX}.tar.gz"
          tar -czf "dist/${ARCHIVE}" -C "target/${TARGET}/release" bside
          (
            cd dist
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          )

      - name: Upload Linux CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.asset_suffix }}
          path: dist/*
          retention-days: 1

  publish-linux-release:
    name: Publish Linux CLI (fast server deploy)
    needs: [prepare, build-linux-cli]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*-linux
          path: dist
          merge-multiple: true

      - name: Publish prerelease with Linux binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: bside ${{ needs.prepare.outputs.tag }}
          prerelease: true
          make_latest: "false"
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256

  build-other-cli:
    name: Build CLI (${{ matrix.asset_suffix }})
    needs: [prepare, build-web]
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            asset_suffix: x86_64-macos
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_suffix: aarch64-macos
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_suffix: x86_64-windows
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Download prebuilt Web UI
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive and checksum (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ARCHIVE="bside-${TAG}-${ASSET_SUFFIX}.tar.gz"
          tar -czf "dist/${ARCHIVE}" -C "target/${TARGET}/release" bside
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
            else
              shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
            fi
          )

      - name: Package archive and checksum (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = "bside-$env:TAG-$env:ASSET_SUFFIX.zip"
          $archivePath = Join-Path "dist" $archive
          $binaryPath = Join-Path "target" "$env:TARGET\release\bside.exe"
          Compress-Archive -Path $binaryPath -DestinationPath $archivePath -Force
          $hash = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $line = "$hash  $archive`n"
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path "dist") "$archive.sha256"), $line, [System.Text.UTF8Encoding]::new($false))

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.asset_suffix }}
          path: dist/*
          retention-days: 1

  publish-cli-release:
    name: Promote GitHub Release to Latest (all CLI)
    needs: [prepare, build-linux-cli, build-other-cli, publish-linux-release]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true

      - name: Generate CLI SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          files=(*.tar.gz *.zip)
          LC_ALL=C sha256sum "${files[@]}" | LC_ALL=C sort -k 2 > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Publish full CLI release as Latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: bside ${{ needs.prepare.outputs.tag }}
          prerelease: false
          make_latest: "true"
          files: |
            dist/*-macos.tar.gz
            dist/*-macos.tar.gz.sha256
            dist/*-windows.zip
            dist/*-windows.zip.sha256
            dist/SHA256SUMS.txt

  build-desktop:
    name: Build Desktop (${{ matrix.asset_suffix }})
    needs: [prepare, build-web]
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_suffix: aarch64-macos
          - target: x86_64-apple-darwin
            os: macos-latest
            asset_suffix: x86_64-macos
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_suffix: x86_64-windows
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            asset_suffix: x86_64-linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Download prebuilt Web UI
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: desktop-${{ matrix.target }}

      - name: Install Tauri CLI
        shell: bash
        run: npm install -g @tauri-apps/cli@^2

      - name: Sync release version into Tauri metadata
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          export VERSION="${TAG#v}"
          node -e '
            const fs = require("fs");
            const version = process.env.VERSION;
            const confPath = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(confPath, "utf8"));
            conf.version = version;
            fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + "\n");
            const cargoPath = "src-tauri/Cargo.toml";
            const cargo = fs.readFileSync(cargoPath, "utf8").replace(
              /^version = "[^"]*"/m,
              `version = "${version}"`
            );
            fs.writeFileSync(cargoPath, cargo);
          '

      - name: Build desktop installer bundles
        shell: bash
        working-directory: src-tauri
        env:
          NO_STRIP: "true"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS:-}" == "macOS" ]] && [[ -z "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            # Ad-hoc sign the .app bundle before DMG creation so Apple Silicon
            # accepts the signature once macOS quarantine is cleared.
            export APPLE_SIGNING_IDENTITY="-"
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          printf '{"build":{"beforeBuildCommand":"echo Using prebuilt web/dist"}}\n' > ci-override.json
          tauri build --target ${{ matrix.target }} --config ci-override.json
          rm -f ci-override.json

      - name: Collect desktop release assets
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          BUNDLE_DIR="src-tauri/target/${TARGET}/release/bundle"

          shopt -s nullglob
          for f in "${BUNDLE_DIR}"/dmg/*.dmg; do
            cp "$f" "release-assets/bside-${TAG}-${ASSET_SUFFIX}.dmg"
          done
          for f in "${BUNDLE_DIR}"/msi/*.msi; do
            cp "$f" "release-assets/bside-${TAG}-${ASSET_SUFFIX}.msi"
          done
          for f in "${BUNDLE_DIR}"/nsis/*-setup.exe; do
            cp "$f" "release-assets/bside-${TAG}-${ASSET_SUFFIX}-setup.exe"
          done
          for f in "${BUNDLE_DIR}"/appimage/*.AppImage; do
            cp "$f" "release-assets/bside-${TAG}-${ASSET_SUFFIX}.AppImage"
          done
          for f in "${BUNDLE_DIR}"/deb/*.deb; do
            cp "$f" "release-assets/bside-${TAG}-${ASSET_SUFFIX}.deb"
          done
          for f in "${BUNDLE_DIR}"/rpm/*.rpm; do
            cp "$f" "release-assets/bside-${TAG}-${ASSET_SUFFIX}.rpm"
          done

          # Package a standalone native Linux desktop tarball for Arch and other
          # rolling-release distros where Ubuntu-built AppImages can clash with
          # system Mesa/glibc/FUSE2.
          if [[ "${RUNNER_OS:-}" == "Linux" ]]; then
            STAGE_DIR="$(mktemp -d)"
            PKG_DIR="${STAGE_DIR}/bside-${TAG}-${ASSET_SUFFIX}-desktop"
            mkdir -p "${PKG_DIR}"
            cp "src-tauri/target/${TARGET}/release/bside-desktop" "${PKG_DIR}/bside-desktop"
            chmod +x "${PKG_DIR}/bside-desktop"
            cp "src-tauri/icons/icon.png" "${PKG_DIR}/bside.png"
            printf '%s\n' \
              '[Desktop Entry]' \
              'Name=bside' \
              'Comment=Local-first Spotify listening & friend-circle analytics' \
              'Exec=bside-desktop' \
              'Icon=bside' \
              'Terminal=false' \
              'Type=Application' \
              'Categories=AudioVideo;Audio;Music;' \
              > "${PKG_DIR}/bside.desktop"
            tar -czf "release-assets/bside-${TAG}-${ASSET_SUFFIX}-desktop.tar.gz" -C "${STAGE_DIR}" "bside-${TAG}-${ASSET_SUFFIX}-desktop"
            rm -rf "${STAGE_DIR}"
          fi

          ls -la release-assets
          if [ -z "$(ls -A release-assets)" ]; then
            echo "No desktop installer bundles were collected from ${BUNDLE_DIR}" >&2
            exit 1
          fi

      - name: Upload desktop release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.asset_suffix }}
          path: release-assets/*
          retention-days: 1

  publish-desktop-release:
    name: Attach Desktop bundles to Release
    needs: [prepare, build-linux-cli, build-other-cli, build-desktop, publish-cli-release]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      - name: Generate combined SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          files=(*.tar.gz *.zip *.dmg *.msi *-setup.exe *.AppImage *.deb *.rpm)
          LC_ALL=C sha256sum "${files[@]}" | LC_ALL=C sort -k 2 > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload desktop bundles & final checksums
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: bside ${{ needs.prepare.outputs.tag }}
          prerelease: false
          make_latest: "true"
          files: |
            dist/*.dmg
            dist/*.msi
            dist/*-setup.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*-desktop.tar.gz
            dist/SHA256SUMS.txt
